name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject HF Token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, sys
          token = os.environ.get('HF_TOKEN', '')
          if not token:
            print('WARNING: HF_TOKEN secret not set, using placeholder', file=sys.stderr)
          with open('tools.js', 'r') as f:
            content = f.read()
          content = content.replace('__HF_TOKEN__', token)
          with open('tools.js', 'w') as f:
            f.write(content)
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
